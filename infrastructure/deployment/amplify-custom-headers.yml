# Response headers served by AWS Amplify for every path.
#
# script-src carries the sha256 of the inline theme bootstrap in index.html, which has
# to run before first paint to avoid a white flash in dark mode. A hash keeps
# 'unsafe-inline' out of the policy; regenerate it whenever that script changes:
#
#   python3 -c "import re,hashlib,base64,pathlib;b=re.search(r'<script>(.*?)</script>',pathlib.Path('frontend/dist/index.html').read_text(),re.S).group(1);print('sha256-'+base64.b64encode(hashlib.sha256(b.encode()).digest()).decode())"
#
# connect-src names the API Gateway endpoint explicitly, so the page cannot be made to
# talk to any other host.
customHeaders:
  - pattern: '**'
    headers:
      - key: Strict-Transport-Security
        value: 'max-age=31536000; includeSubDomains'
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'sha256-CHFEJy3l1N7qTndHCFtIvSQhpz04JtPuTrBiHszWYtE='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://fo7occiuh3.execute-api.us-east-1.amazonaws.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
